<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>Templo 3D avanzado</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<!-- joystick móvil -->

<script src="https://cdn.jsdelivr.net/npm/aframe-joystick-controls/dist/aframe-joystick-controls.min.js"></script>

<script>

// subir y bajar
AFRAME.registerComponent('fly-controls', {
  tick: function () {
    const pos = this.el.getAttribute('position');
    const speed = 0.08;

    if (keys['e']) pos.y += speed;
    if (keys['q']) pos.y -= speed;

    this.el.setAttribute('position', pos);
  }
});

let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

</script>

</head>

<body>

<a-scene shadow="type:pcfsoft" fog="type: exponential; density:0.02; color:#cce0ff">

<a-assets>

<a-asset-item id="templo" src="AnfiteatroCaral.glb"></a-asset-item>

</a-assets>

<!-- cielo -->

<a-sky color="#87CEEB"></a-sky>

<!-- luz ambiente -->

<a-light type="ambient" intensity="0.35"></a-light>

<!-- sol dinámico -->

<a-entity
gltf-model="#templo"
position="0 0 2"
scale=".2 .2 .2"
shadow="cast:true; receive:true"> </a-entity>

<!-- agua -->


<!-- jugador -->

<a-entity
camera
look-controls
wasd-controls="acceleration:80"
fly-controls
joystick-controls
position="0 1.6 5"> </a-entity>

</a-scene>

</body>
</html>
