<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modelo 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene shadow="type:pcfsoft" fog="type: exponential; density:0.02; color:#cce0ff">

<a-assets>

<a-asset-item id="templo" src="AnfiteatroCaral.glb"></a-asset-item>
 </a-assets>
  <!-- Cámara -->
<a-camera position="0 1.6 6" wasd-controls-enabled="false"></a-camera>

  <!-- Modelo -->
  <a-entity 
    gltf-model="#templo"
    position="0 0.8 0"
    scale="0.8 0.8 0.8"
    shadow="cast: true  receive:true"
    animation="property: rota}tion; to: 0 360 0; loop: true; dur: 20000; easing: linear">
  </a-entity>

</a-scene>
</body>
</html>
