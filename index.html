<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modelo 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<a-scene shadow="type: pcfsoft">

 
  <!-- Cámara -->
<a-camera position="0 1.6 6" wasd-controls-enabled="false"></a-camera>

  <!-- Modelo -->
  <a-entity 
    gltf-model="AnfiteatroCaral.glb"
    position="0 0.8 0"
    scale="0.8 0.8 0.8"
    shadow="cast: true"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
  </a-entity>

</a-scene>
</body>
</html>
