<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Modelo 3D A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
<a-scene
  webxr="optionalFeatures: hit-test, local-floor"
  renderer="alpha: true"
  vr-mode-ui="enabled: true"
  id="scene">

  <
  <a-sky id="sky" src="image.png"></a-sky>
  <a-light type="ambient" intensity="0.5"></a-light>
  <a-light 
    type="directional"
    position="2 5 3"
    intensity="1"
    castShadow="true">
  </a-light>
  <a-camera position="0 1.6 6"></a-camera>
  <a-entity 
    gltf-model="AnfiteatroCaral.glb"
    position="0 0.8 0"
    scale="0.8 0.8 0.8"
    shadow="cast: true"
  </a-entity>
</a-scene>

<script>
const scene = document.querySelector('#scene');
const sky = document.querySelector('#sky');

scene.addEventListener('enter-vr', () => {
  if (scene.is('ar-mode')) {
    console.log("Entrando a AR");
    sky.setAttribute('visible', 'false');
    document.querySelectorAll('a-light').forEach(l => {
      l.setAttribute('intensity', 0.8);
    });
  }
});

scene.addEventListener('exit-vr', () => {
  console.log("Saliendo de AR");
  sky.setAttribute('visible', 'true');
  document.querySelectorAll('a-light').forEach(l => {
    l.setAttribute('intensity', 1);
  });
});
</script>

</body>
</html>
