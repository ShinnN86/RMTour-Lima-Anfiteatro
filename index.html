<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Templo AR estable</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-joystick-controls/dist/aframe-joystick-controls.min.js"></script>

<script>
let keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

AFRAME.registerComponent('fly-controls', {
  tick: function () {
    const pos = this.el.getAttribute('position');
    const speed = 0.05;

    if (keys['e']) pos.y += speed;
    if (keys['q']) pos.y -= speed;

    this.el.setAttribute('position', pos);
  }
});
</script>

</head>

<body>

<a-scene
  webxr="requiredFeatures: hit-test, local-floor"
  renderer="alpha: true"
  vr-mode-ui="enabled: true">

<a-assets>
<a-asset-item id="templo" src="AnfiteatroCaral.glb"></a-asset-item>
</a-assets>

<!-- ❌ eliminamos sky -->
<!-- ❌ eliminamos fog -->

<!-- luz ligera -->
<a-light type="ambient" intensity="1"></a-light>

<!-- modelo -->
<a-entity
  gltf-model="#templo"
  position="0 0 -2"
  scale="0.2 0.2 0.2">
</a-entity>

<!-- cámara -->
<a-entity
  camera
  look-controls
  wasd-controls
  fly-controls
  joystick-controls
  position="0 1.6 0">
</a-entity>

</a-scene>

</body>
</html>
